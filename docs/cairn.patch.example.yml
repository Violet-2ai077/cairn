# Cairn Reference Host Adapter Patch for DeepSeek Harness (dsh 0.2.2-rc.5)
# Usage:
#   dsh --profile web --patch /absolute/path/to/cairn/docs/cairn.patch.example.yml

- insert:
    - id: cairn
      name: 'file:///absolute/path/to/cairn/src/hosts/dsh/index.mjs'
      config:
        # Omit workspaceRoot for centralized per-session Hub mode.
        # Defaults to $DSH_HOME/cairn, then ~/.cairn. Use storeRoot for isolated tests.
        # storeRoot: '/absolute/path/to/cairn-hub'
        actorId: 'dsh-main'
        stripMarkerInStream: true
        autoCompactMinRecords: 12
        autoCompactMinChars: 4500
        maxTailChars: 6000
        autoCompactCooldownMs: 300000
        # Slice A: only verified Project decisions may auto-commit.
        # Existing host configurations without this block remain stage-only.
        autopilot:
          enabled: true
          autoCommit:
            project: true
            supersede: true
          taskHeat:
            enabled: true
            hotMaxTasks: 24
            idleDays: 14
            dormantMaxCandidates: 5
            # One deadline for both routing stages, in milliseconds.
            routeTimeoutMs: 2500
          midSessionSwitch:
            enabled: true
            # Native transcript still contains earlier project messages.
            crossProject: false
            routeTimeoutMs: 2500
        # Hub workers use the selected dsh model route. The legacy workspace
        # adapter's useHostLlm and worker* settings do not configure Hub workers.
