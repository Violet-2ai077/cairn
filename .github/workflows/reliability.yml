name: Cairn reliability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'
permissions:
  contents: read
jobs:
  reliability:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Install the release tarball offline and execute its installed command
        shell: bash
        run: |
          set -eu
          dir="$(mktemp -d)"
          pkg="$(npm pack --silent --pack-destination "$dir")"
          npm install --prefix "$dir/consumer" --offline --no-audit --no-fund --ignore-scripts "$dir/$pkg"
          "$dir/consumer/node_modules/.bin/cairn" status --store "$dir/unused" --json > "$dir/result.json"
          node -e 'const s=JSON.parse(require("node:fs").readFileSync(process.argv[1])); if(s.initialized !== false)process.exit(1)' "$dir/result.json"
          test ! -e "$dir/unused"
      - run: node scripts/eval-reliability.mjs > attribution-eval.json
      - run: node scripts/bench-hub.mjs --output hub-benchmark.json
      - if: github.event_name == 'schedule'
        run: node scripts/bench-hub.mjs --tasks 1000 --records 100 --samples 30 --output hub-benchmark-large.json
      - uses: actions/upload-artifact@v4
        with:
          name: hub-benchmark-${{ matrix.os }}-${{ matrix.node }}
          path: |
            hub-benchmark*.json
            attribution-eval.json
      - name: Install pinned real host in an isolated prefix
        if: matrix.node == 24
        run: npm install --prefix "${{ runner.temp }}/cairn-smoke" --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.5
      - name: Check real host using the offline provider
        if: matrix.node == 24
        run: node scripts/smoke-dsh.mjs "${{ runner.temp }}/cairn-smoke/node_modules/@deepseek-ai/dsh/lib/bin.js"
      - name: Check strict task sessions
        if: matrix.node == 24
        run: node scripts/smoke-dsh.mjs "${{ runner.temp }}/cairn-smoke/node_modules/@deepseek-ai/dsh/lib/bin.js" --separate-session-only
      - name: Verify English and Chinese on the installed host
        if: matrix.node == 24
        run: node scripts/smoke-dsh.mjs "${{ runner.temp }}/cairn-smoke/node_modules/@deepseek-ai/dsh/lib/bin.js" --locale-only
      - name: Check repository discovery and marker rejection in real dsh
        if: matrix.node == 24
        run: node scripts/smoke-dsh.mjs "${{ runner.temp }}/cairn-smoke/node_modules/@deepseek-ai/dsh/lib/bin.js" --project-boundary-only
      - name: Check extended IDs across a native session restart
        if: matrix.node == 24
        run: node scripts/smoke-dsh.mjs "${{ runner.temp }}/cairn-smoke/node_modules/@deepseek-ai/dsh/lib/bin.js" --marker-bank-only
